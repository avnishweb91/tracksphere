services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracksphere
      POSTGRES_USER: tracksphere
      POSTGRES_PASSWORD: tracksphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracksphere -d tracksphere"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tracksphere
      SPRING_DATASOURCE_USERNAME: tracksphere
      SPRING_DATASOURCE_PASSWORD: tracksphere
      APP_JWT_SECRET: change-me-to-a-long-random-256-bit-secret-before-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
