spring:
  application: { name: tracksphere }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tracksphere}
    username: ${SPRING_DATASOURCE_USERNAME:tracksphere}
    password: ${SPRING_DATASOURCE_PASSWORD:tracksphere}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway: { enabled: true }
server: { port: ${PORT:8080}, error: { include-message: never } }
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-development-secret-must-be-at-least-32-characters-long}
    access-token-expiration: 15m
    refresh-token-expiration: 30d
springdoc:
  swagger-ui: { path: /swagger-ui.html }
management:
  endpoints: { web: { exposure: { include: health,info } } }
